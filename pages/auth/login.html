<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarbieLândia - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <h1>Barbie World</h1>
      <p>Entre para acessar seu perfil de colecionador</p>
    </div>

    <form class="login-form" action="index.html" method="POST">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite uma senha" required>
      </div>

      <div>
        <a href="recuperar-senha.html" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="login-footer">
      <p>Não tem uma conta? <a href="cadastro-usuario.html">Cadastre-se</a></p>
      <p><a href="../../index.html" class="back-home">Voltar para a Página Inicial</a></p>
    </div>
  </div>

</body>
</html>
