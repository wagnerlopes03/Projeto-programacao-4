<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/recuperar-senha.css">
  <title>Barbie World - Recuperar Senha</title>
  
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-header">
      <h1>Recuperar Senha</h1>
      <p>Digite seu e-mail cadastrado para receber as instruções de redefinição.</p>
    </div>

    <form action="login.html" method="POST">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="seuemail@exemplo.com" 
          required
        >
      </div>

      <button type="submit" class="btn-login">Enviar Link de Recuperação</button>
    </form>

    <div class="login-footer">
      <p>Lembrou da senha? <a href="login.html">Voltar para o Login</a></p>
      <p><a href="../../index.html" class="back-home">Voltar para a Página Inicial</a></p>
    </div>
  </div>
</body>
</html>
