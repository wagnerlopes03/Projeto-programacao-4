<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Hi Barbie - Meu Perfil</title>
</head>

<body>
    <header>
        <a href="../../index.html" class="logo">Hi Barbie</a>
        <nav>
            <a href="../../index.html">Início</a>
            <a href="../catalogo/listagem.html">Bonecas</a>
            <a href="../noticias/noticias.html">Notícias</a>
            <a href="../forum/forum.html">Dreamhouse Chat</a>
            <a href="perfil.html" class="nav-ativo">Meu Perfil</a>
        </nav>
    </header>

    <main>
        <section id="pagina-perfil">
            <div class="perfil-layout">
                <div class="coluna-esquerda">
                    <div class="coluna-avatar">
                        <div class="avatar-placeholder">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <h1>Editar Perfil</h1>
                        <p class="subtitulo-perfil">Atualize suas informações pessoais e preferências</p>
                    </div>

                    <div class="coluna-stats">
                        <a href="minha-colecao.html" class="stat-card">
                            <i class="fa-solid fa-gem"></i>
                            <span class="stat-numero">12</span>
                            <span class="stat-label">Bonecas na coleção</span>
                        </a>
                        <a href="meus-posts.html" class="stat-card">
                            <i class="fa-solid fa-comments"></i>
                            <span class="stat-numero">7</span>
                            <span class="stat-label">Posts no fórum</span>
                        </a>
                    </div>
                </div>

                <div class="coluna-direita">
                    <div class="secao-form">
                        <div class="secao-header">
                            <i class="fa-solid fa-id-card"></i>
                            <h2>Informações Pessoais</h2>
                        </div>
                        <div class="campo-form">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" value="Ana Luiza">
                        </div>
                        <div class="linha-dupla">
                            <div class="campo-form">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" value="analu@email.com">
                            </div>
                            <div class="campo-form">
                                <label for="nascimento">Data de nascimento</label>
                                <input type="date" id="nascimento" value="2007-03-15">
                            </div>
                        </div>
                        <div class="campo-form">
                            <label for="pais">País</label>
                            <input type="text" id="pais" value="Brasil">
                        </div>
                    </div>

                    <div class="secao-form">
                        <div class="secao-header">
                            <i class="fa-solid fa-heart"></i>
                            <h2>Preferências Barbie</h2>
                        </div>
                        <div class="campo-form">
                            <label for="boneca-favorita">Boneca favorita</label>
                            <input type="text" id="boneca-favorita" value="Barbie Sereia">
                        </div>
                    </div>

                    <div class="secao-form">
                        <div class="secao-header">
                            <i class="fa-solid fa-shield-halved"></i>
                            <h2>Responsável</h2>
                        </div>
                        <div class="campo-form">
                            <label for="cpf-responsavel">CPF do responsável</label>
                            <input type="text" id="cpf-responsavel" value="•••.•••.•••-••">
                        </div>
                    </div>

                    <button class="btn-editar-perfil">Salvar Alterações</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Barbie Universe - Todos os direitos reservados.</p>
    </footer>
</body>

</html>
