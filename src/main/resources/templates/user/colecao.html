<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/colecao.css}">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Hi Barbie - Minha Coleção</title>
</head>

<body class="pagina-colecao-body">
<header>
    <a th:href="@{/}" class="logo">Hi Barbie</a>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/catalogo/listagem}">Barbies</a>
        <a th:href="@{/noticias}">Notícias</a>
        <a th:href="@{/forum}">Dreamhouse Chat</a>
        <a th:href="@{/user/perfil}">Meu Perfil</a>
    </nav>
</header>

<main>
    <section id="pagina-colecao">

        <div class="colecao-layout">

            <div class="coluna-esquerda">
                <div class="secao-form">
                    <div class="secao-header">
                        <i class="fa-solid fa-plus"></i>
                        <h2>Adicionar Boneca</h2>
                    </div>

                    <form th:action="@{/user/colecao/salvar}" method="POST">
                        <div class="campo-form">
                            <label for="nome">Nome da Boneca</label>
                            <input type="text" id="nome" name="nome" placeholder="Ex: Barbie Sereia" required>
                        </div>

                        <div class="campo-form">
                            <label for="descricao">Descrição</label>
                            <textarea id="descricao" name="descricao" placeholder="Detalhes sobre essa boneca..."></textarea>
                        </div>

                        <div class="campo-form">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" name="categoria">
                                <option value="Princesa">Princesa</option>
                                <option value="Sereia">Sereia</option>
                                <option value="Colecionável">Colecionável</option>
                                <option value="Profissões">Profissões</option>
                                <option value="Moda">Moda</option>
                                <option value="Aventura">Aventura</option>
                            </select>
                        </div>

                        <div class="campo-form">
                            <label for="ano">Ano de aquisição</label>
                            <input type="number" id="ano" name="ano" placeholder="2026">
                        </div>

                        <div class="campo-form">
                            <label for="fotoUrl">Link da foto</label>
                            <input type="text" id="fotoUrl" name="fotoUrl" placeholder="https://...">
                        </div>

                        <div class="campo-form">
                            <label for="visibilidade">Visibilidade</label>
                            <select id="visibilidade" name="visibilidade">
                                <option value="publico">🌍 Pública</option>
                                <option value="privado">🔒 Privada</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-editar-perfil">Adicionar à Coleção</button>
                    </form>
                </div>
            </div>

            <div class="coluna-direita">
                <div class="colecao-topo">
                    <div>
                        <h1 class="titulo-colecao">Minha Coleção</h1>
                        <p class="subtitulo-colecao" th:text="${#lists.size(colecao)} + ' bonecas cadastradas'">0 bonecas cadastradas</p>
                    </div>

                    <form th:action="@{/user/colecao/visibilidade}" method="POST">
                        <button type="submit" class="btn-visibilidade" th:classappend="${colecaoPublica} ? 'publica' : 'privada'">
                            <i class="fa-solid" th:classappend="${colecaoPublica} ? 'fa-earth-americas' : 'fa-lock'"></i>
                            <span th:text="${colecaoPublica} ? 'Coleção Pública' : 'Coleção Privada'">Status</span>
                        </button>
                    </form>
                </div>

                <div class="grid-colecao">
                    <div class="card-colecao" th:each="boneca : ${colecao}">
                        <div class="card-colecao-img">
                            <img th:src="${boneca.fotoUrl}" th:alt="${boneca.nome}">
                        </div>
                        <h3 th:text="${boneca.nome}">Nome</h3>
                        <span class="tag-categoria" th:text="${boneca.categoria}">Categoria</span>
                    </div>
                </div>
            </div>

        </div>

    </section>
</main>

<footer>
    <p>&copy; 2026 Hi Barbie - Todos os direitos reservados.</p>
</footer>
</body>

</html>
