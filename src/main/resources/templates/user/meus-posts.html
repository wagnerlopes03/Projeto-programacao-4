<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/forum.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Hi Barbie - Meus Posts</title>

<body>
<header>
    <a th:href="@{/}" class="logo">Hi Barbie</a>

        <a th:href="@{/noticias}">Notícias</a>
        <a th:href="@{/forum}">Dreamhouse Chat</a>
        <a th:href="@{/user/perfil}">Meu Perfil</a>

<main>
    <section id="pagina-forum">

            <a th:href="@{/forum/discussao}" class="item-topico">

                </div>

    </section>
</main>

<footer>
