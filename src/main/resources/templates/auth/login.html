<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Hi Barbie - Login</title>
</head>

<body>
<header>
    <a th:href="@{/}" class="logo">Hi Barbie</a>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/catalogo/listagem}">Bonecas</a>
        <a th:href="@{/noticias/noticias}">Notícias</a>
        <a th:href="@{/forum/forum}">Dreamhouse Chat</a>
        <a th:href="@{/auth/login}">Login</a>
    </nav>
</header>

<section id="pagina-login">
    <div class="card-auth">
        <h1>Bem-vinda de volta!</h1>
        <p class="subtitulo-auth">Entre para acessar sua coleção e o Dreamhouse Chat.</p>

        <form th:action="@{/auth/login}" method="POST">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha">

            <button type="submit" class="btn-auth">Entrar</button>
        </form>
        <p class="link-alternar">Esqueceu a senha? <a th:href="@{/auth/recuperar-senha}">Recupere!</a></p>
        <p class="link-alternar">Não tem conta? <a th:href="@{/auth/cadastro-usuario}">Cadastre-se</a></p>
    </div>
</section>

<footer>
    <p>&copy; 2026 Barbie News - Todos os direitos reservados.</p>
</footer>
</body>
</html>
