<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/recuperar-senha.css}">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Hi Barbie - Recuperar Senha</title>
</head>
<body>
<header>
    <a th:href="@{/}" class="logo">Hi Barbie</a>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/catalogo/listagem}">Bonecas</a>
        <a th:href="@{/noticias/noticias}">Notícias</a>
        <a th:href="@{/forum/forum}">Dreamhouse Chat</a>
        <a th:href="@{/auth/login}">Login</a>
    </nav>
</header>
<main>
    <section id="pagina-senha">
        <div class="card-auth">
            <h1>Recuperar Senha</h1>
            <p class="subtitulo-auth">Digite seu e-mail cadastrado para receber as instruções de redefinição.</p>
            <form th:action="@{/auth/recuperar-senha}" method="POST">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            required
                    >
                </div>
                <button type="submit" class="btn-login">Enviar Link de Recuperação</button>
            </form>
            <p class="link-alternar">Lembrou da senha? <a th:href="@{/auth/login}">Voltar para o Login</a></p>
            <p class="link-alternar"><a th:href="@{/}" class="back-home">Voltar para a Página Inicial</a></p>
        </div>
    </section>
</main>
<footer>
    <p>&copy; 2026 Barbie News - Todos os direitos reservados.</p>
</footer>
</body>
</html>
