<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/forum.css}">
    <link rel="stylesheet" th:href="@{/css/discussao.css}">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Novo Tópico</title>
</head>


<body>
<header>
    <a th:href="@{/}" class="logo">Hi Barbie</a>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/forum}">Dreamhouse Chat</a>
    </nav>
</header>

<main>
    <section id="pagina-discussao">
        <div class="caixa-resposta" style="max-width: 600px; margin: 40px auto;">
            <h3>Criar novo tópico</h3>
            <form th:action="@{/forum/novo-topico/salvar}" method="POST">
                <input type="text" name="categoria" placeholder="Categoria (ex: Bate-Papo)" style="width:100%; margin-bottom:12px; padding:10px;">
                <input type="text" name="titulo" placeholder="Título do tópico" style="width:100%; margin-bottom:12px; padding:10px;">
                <textarea name="texto" placeholder="Escreva aqui..."></textarea>
                <button type="submit" class="btn-auth">Publicar</button>
            </form>
        </div>
    </section>
</main>

</body>
</html>
